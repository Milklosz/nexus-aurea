name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.os }} / React, Tauri, Rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          cache: true

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Bootstrap Cargo lockfile (temporary)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Upload resolved Cargo lockfile (temporary)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock-${{ runner.os }}-${{ github.sha }}
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build React and TypeScript
        run: pnpm build

      - name: Check patch whitespace
        run: git diff --check

      - name: Check Rust backend (Windows MSVC)
        if: runner.os == 'Windows'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Check Rust backend (macOS)
        if: runner.os == 'macOS'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Clear cached NSIS installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleDirectory = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          if (Test-Path -LiteralPath $bundleDirectory) {
            Get-ChildItem -LiteralPath $bundleDirectory -Filter '*-setup.exe' -File | Remove-Item -Force
          }

      - name: Build Windows x64 NSIS installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --ci --target x86_64-pc-windows-msvc

      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        run: pnpm tauri build --no-bundle --ci

      - name: Upload Windows installer artifact
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v7
        with:
          name: NEXUS-AUREA-Windows-x64-${{ github.sha }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Build isolated Test Windows x64 NSIS installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --ci --target x86_64-pc-windows-msvc --config src-tauri/tauri.test.conf.json

      - name: Upload isolated Test installer artifact
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v7
        with:
          name: NEXUS-AUREA-Test-Windows-x64-${{ github.sha }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*Test*-setup.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          name: NEXUS-AUREA-Windows-x64-${{ github.sha }}
          path: dist/installers

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/installers/*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/installers/*.exe \
              --title "NEXUS AUREA $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

