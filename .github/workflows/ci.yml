name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: ${{ matrix.os }} / React, Tauri, Rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          cache: true

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build React and TypeScript
        run: pnpm build

      - name: Check Rust backend (Windows MSVC)
        if: runner.os == 'Windows'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Check Rust backend (macOS)
        if: runner.os == 'macOS'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app (Windows MSVC)
        if: runner.os == 'Windows'
        run: pnpm tauri build --no-bundle --ci --target x86_64-pc-windows-msvc

      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        run: pnpm tauri build --no-bundle --ci
