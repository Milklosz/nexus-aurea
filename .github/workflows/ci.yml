name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.os }} / React, Tauri, Rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VELORA_SOURCE_SHA: ${{ github.sha }}
      VELORA_CHECKOUT_SHA: ${{ github.sha }}
      VELORA_BUILD_EVENT: ${{ github.event_name }}
      VELORA_BUILD_REF: ${{ github.ref }}
      VELORA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      VELORA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          cache: true

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Test build provenance manifest
        run: pnpm test:provenance

      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build React and TypeScript
        run: pnpm build

      - name: Check patch whitespace
        shell: pwsh
        run: |
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git diff --check "$($event.pull_request.base.sha)...HEAD"
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $event.before -match '^[0-9a-f]{40,64}$' -and $event.before -notmatch '^0+$') {
            git diff --check "$($event.before)..HEAD"
          } else {
            git diff --check "HEAD^..HEAD"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace check failed for the event commit range.' }

      - name: Check Rust backend (Windows MSVC)
        if: runner.os == 'Windows'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Check Rust backend (macOS)
        if: runner.os == 'macOS'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Clear cached NSIS installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleDirectory = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          if (Test-Path -LiteralPath $bundleDirectory) {
            Get-ChildItem -LiteralPath $bundleDirectory -Filter '*-setup.exe' -File | Remove-Item -Force
          }

      - name: Build Windows x64 NSIS installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --ci --target x86_64-pc-windows-msvc

      - name: Record and verify Windows build provenance
        if: runner.os == 'Windows' && success()
        shell: pwsh
        run: |
          $bundleDirectory = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundleDirectory -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer; found $($installers.Count)."
          }
          $sevenZipCommand = Get-Command '7z.exe' -ErrorAction SilentlyContinue
          $sevenZipPath = if ($sevenZipCommand) { $sevenZipCommand.Source } else { $null }
          if (-not $sevenZipPath) {
            $sevenZipCandidates = @(
              (Join-Path $env:ProgramFiles '7-Zip/7z.exe'),
              (Join-Path ${env:ProgramFiles(x86)} '7-Zip/7z.exe')
            )
            $sevenZipPath = $sevenZipCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $sevenZipPath) { throw '7-Zip is unavailable; the installer payload cannot be verified.' }

          $extractDirectory = Join-Path $env:RUNNER_TEMP "velora-payload-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          New-Item -ItemType Directory -Path $extractDirectory -ErrorAction Stop | Out-Null
          & $sevenZipPath x -y "-o$extractDirectory" $installers[0].FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the NSIS installer for payload verification.' }
          # Evidence for review: every file 7-Zip extracted from the real installer.
          Write-Host '--- Extracted installer payload ---'
          Get-ChildItem -LiteralPath $extractDirectory -Recurse -File | ForEach-Object {
            Write-Host ("{0,12}  {1}  {2}" -f $_.Length, (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.FullName.Substring($extractDirectory.Length + 1))
          }
          # The verifier (--extracted-dir) enforces the reviewed executable list: exactly one packaged
          # nexus-aurea.exe plus the pinned NSIS plugin DLLs; any other executable fails the build.
          $builtExe = 'src-tauri/target/x86_64-pc-windows-msvc/release/nexus-aurea.exe'
          if (-not (Test-Path -LiteralPath $builtExe -PathType Leaf)) { throw 'The release payload EXE is missing.' }
          $manifest = Join-Path $bundleDirectory 'velora-build-provenance.json'
          # --ci: every tool version must be available (pnpm, Tauri CLI, MSVC and Windows SDK included),
          # the built EXE and the packaged EXE must be related by exactly the reviewed Tauri bundle-type
          # marker change, and the manifest is compared with this job's GitHub context and installed tools.
          node scripts/build-provenance.mjs write --ci --installer "$($installers[0].FullName)" --payload "$builtExe" --extracted-dir "$extractDirectory" --manifest "$manifest"
          if ($LASTEXITCODE -ne 0) { throw 'Could not write and verify the build provenance manifest.' }
          node scripts/build-provenance.mjs verify --ci --installer "$($installers[0].FullName)" --payload "$builtExe" --extracted-dir "$extractDirectory" --manifest "$manifest"
          if ($LASTEXITCODE -ne 0) { throw 'The build provenance manifest does not match its output files.' }

          # Release preview: the same file selection and installer/manifest check the release job will
          # use, run without publishing anything.
          $preview = Join-Path $env:RUNNER_TEMP "velora-release-preview-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          New-Item -ItemType Directory -Path $preview -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName, $manifest -Destination $preview
          $assets = @(node scripts/build-provenance.mjs release-assets --dir "$preview")
          if ($LASTEXITCODE -ne 0 -or $assets.Count -ne 2) { throw 'The release asset selection failed.' }
          node scripts/build-provenance.mjs verify-release --preview --installer "$($assets[0])" --manifest "$($assets[1])"
          if ($LASTEXITCODE -ne 0) { throw 'The release assets do not match each other.' }

          $provenance = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          @(
            '## Windows installer provenance'
            ''
            "- Source SHA: $($provenance.source.sourceSha)"
            "- Checkout SHA: $($provenance.source.checkoutSha)"
            "- Event/ref: $($provenance.source.event) / $($provenance.source.ref)"
            "- Dirty: $($provenance.source.dirty)"
            "- Installer: $($provenance.artifacts.installer.name) ($($provenance.artifacts.installer.sizeBytes) bytes)"
            "- Installer SHA-256: $($provenance.artifacts.installer.sha256)"
            "- Built EXE: $($provenance.artifacts.builtExe.name) ($($provenance.artifacts.builtExe.sizeBytes) bytes)"
            "- Built EXE SHA-256: $($provenance.artifacts.builtExe.sha256)"
            "- Packaged payload EXE: $($provenance.artifacts.packagedExe.name) ($($provenance.artifacts.packagedExe.sizeBytes) bytes)"
            "- Packaged payload EXE SHA-256: $($provenance.artifacts.packagedExe.sha256)"
            "- Payload relation: $($provenance.artifacts.payloadRelation.transformation) at offset $($provenance.artifacts.payloadRelation.markerOffset) ($($provenance.artifacts.payloadRelation.policy))"
            "- Tools: node $($provenance.tools.node); pnpm $($provenance.tools.pnpm); $($provenance.tools.rustc); $($provenance.tools.cargo); $($provenance.tools.tauriCli); MSVC $($provenance.tools.msvc); Windows SDK $($provenance.tools.windowsSdk)"
            '- Verification: internal consistency passed; CI origin was compared with this job''s GitHub context and runner tools (the runner is the only witness).'
            '- Not a digital signature: hashes and this manifest do not prove who built the files.'
            '- The Actions artifact ZIP digest is reported separately by GitHub.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        run: pnpm tauri build --no-bundle --ci

      - name: Upload Windows installer artifact
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v7
        with:
          name: VELORA-Windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/velora-build-provenance.json
          if-no-files-found: error
          retention-days: 30

  playnite-extension:
    name: Windows / Playnite extension (net462)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore Playnite SDK 6.18.0
        working-directory: playnite-extension
        run: msbuild VeloraLibraryExporter.csproj /t:Restore /p:Configuration=Release

      - name: Build Playnite extension
        working-directory: playnite-extension
        run: msbuild VeloraLibraryExporter.csproj /p:Configuration=Release

      - name: Verify extension output
        shell: pwsh
        run: |
          $dll = 'playnite-extension/bin/Release/VeloraLibraryExporter.dll'
          if (-not (Test-Path -LiteralPath $dll)) {
            throw "Expected Playnite extension DLL was not produced."
          }
          Copy-Item -LiteralPath 'playnite-extension/extension.yaml' -Destination 'playnite-extension/bin/Release/extension.yaml'
          Get-Item -LiteralPath $dll | Select-Object FullName, Length

      - name: Upload Playnite extension
        uses: actions/upload-artifact@v7
        with:
          name: VELORA-Playnite-Extension-${{ github.sha }}
          path: |
            playnite-extension/bin/Release/VeloraLibraryExporter.dll
            playnite-extension/bin/Release/extension.yaml
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source (verification script and schema only)
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          name: VELORA-Windows-x64-${{ github.sha }}
          path: dist/installers

      - name: Select and verify release assets
        id: assets
        shell: bash
        run: |
          # Exactly one installer and its provenance manifest, nothing else; the manifest must
          # belong to this installer and to this run's commit, event and tag.
          mapfile -t assets < <(node scripts/build-provenance.mjs release-assets --dir dist/installers)
          [ "${#assets[@]}" -eq 2 ] || { echo "Expected the installer and the manifest."; exit 1; }
          node scripts/build-provenance.mjs verify-release --installer "${assets[0]}" --manifest "${assets[1]}"
          printf 'installer=%s\nmanifest=%s\n' "${assets[0]}" "${assets[1]}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INSTALLER: ${{ steps.assets.outputs.installer }}
          RELEASE_MANIFEST: ${{ steps.assets.outputs.manifest }}
        shell: bash
        run: |
          # The manifest is published together with the installer it describes.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RELEASE_INSTALLER" "$RELEASE_MANIFEST" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RELEASE_INSTALLER" "$RELEASE_MANIFEST" \
              --title "VELORA $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

