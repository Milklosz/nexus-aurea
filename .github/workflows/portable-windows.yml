name: Portable Windows validation build

# Reproducible no-install candidate for MSI hardware validation. It never runs
# an installer, never writes the registry and never touches the installed app's
# data. The main CI workflow (.github/workflows/ci.yml) still runs the frontend,
# Rust, Playnite and Windows checks; this workflow builds and packages the
# isolated candidate and records its provenance.
on:
  workflow_dispatch:
  # Every PR — including PRs from feat/velora-3-ascension* branches — builds the
  # portable candidate, so each Ascension PR proves its own no-install artifact.
  pull_request:
  push:
    branches:
      - feat/portable-validation-build
      - 'feat/velora-3-ascension*'
      - 'feat/velora-3-singularity*'
      - fix/velora-3-first-frame-recovery

permissions:
  contents: read

jobs:
  portable-windows:
    name: Windows x64 / portable validation candidate
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      # PRs are checked out at their head commit, not at GitHub's synthetic
      # merge commit, so the manifest names a real source commit.
      VELORA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VELORA_EVENT_SHA: ${{ github.sha }}
      VELORA_PR_NUMBER: ${{ github.event.pull_request.number }}
      VELORA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      VELORA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      VELORA_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      VELORA_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout matches the recorded source commit
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:VELORA_SOURCE_SHA) {
            throw "Checkout $head does not match source commit $env:VELORA_SOURCE_SHA."
          }
          $dirty = (git status --porcelain)
          if ($dirty) { throw "The checkout is dirty; refusing to build a provenance record." }
          Write-Host "SOURCE_SHA=$head"
          Write-Host "EVENT_SHA=$env:VELORA_EVENT_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          cache: true

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test portable manifest tooling
        run: pnpm test:portable-manifest

      - name: Test portable data-root isolation invariants
        run: pnpm test:portable-isolation

      - name: Test genesis CI wiring guards
        run: pnpm test:genesis-ci

      - name: Test SHA-256 artifact manifest tooling
        run: pnpm test:manifest

      - name: Test IPC contract drift (lib.rs handler registry vs IPC_COMMANDS)
        run: pnpm test:ipc-contract

      - name: Build React and TypeScript
        run: pnpm build

      - name: Build standalone Windows x64 executable (no bundle)
        # --no-bundle is essential: an NSIS installer is never produced or run.
        run: pnpm tauri build --no-bundle --ci --target x86_64-pc-windows-msvc --features portable-validation

      - name: Stage the portable package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'velora-portable-stage'
          $output = Join-Path $env:GITHUB_WORKSPACE 'dist/portable'
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -ErrorAction Stop | Out-Null
          New-Item -ItemType Directory -Force -Path $output -ErrorAction Stop | Out-Null
          $exe = 'src-tauri/target/x86_64-pc-windows-msvc/release/nexus-aurea.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Standalone EXE was not built.' }
          Copy-Item -LiteralPath $exe -Destination (Join-Path $stage 'nexus-aurea.exe')
          $support = @(
            'scripts/portable/Run-VELORA-Portable.cmd',
            'scripts/portable/Start-VELORA-Portable.ps1',
            'scripts/portable/Preflight-WebView2.ps1',
            'scripts/portable/README-PORTABLE.md'
          )
          foreach ($file in $support) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing support file: $file" }
            Copy-Item -LiteralPath $file -Destination $stage
          }
          Get-ChildItem -LiteralPath $stage -File | ForEach-Object {
            Write-Host ("{0,12}  {1}" -f $_.Length, $_.Name)
          }

      - name: Verify visible Windows startup, React readiness and orderly shutdown
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'velora-portable-stage'
          $smokeDir = Join-Path $env:RUNNER_TEMP "velora-first-frame-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          $output = Join-Path $env:GITHUB_WORKSPACE 'dist/portable'
          $dataRoot = Join-Path $smokeDir 'VELORA-Portable-Data'
          $trace = ''
          $tracePath = Join-Path $output 'startup-smoke.log'
          $result = [ordered]@{
            status = 'STARTUP-BLOCKED'
            evidenceType = 'windows-visible-window-and-react-smoke'
            platform = 'windows-latest (GitHub Actions)'
            hardwareValidated = $false
            processStarted = $false
            runtimeInitialized = $false
            eventLoopStarted = $false
            windowCreated = $false
            windowVisible = $false
            frontendReady = $false
            runningAtReadiness = $false
            installedProfileCreated = $false
            portableWebViewProfile = $false
            shutdownRequested = $false
            cleanShutdown = $false
            exitCode = $null
          }
          $process = $null
          try {
            New-Item -ItemType Directory -Path $smokeDir -ErrorAction Stop | Out-Null
            $exe = Join-Path $smokeDir 'nexus-aurea.exe'
            Copy-Item -LiteralPath (Join-Path $stage 'nexus-aurea.exe') -Destination $exe
            $installedProfiles = @('ApplicationData', 'LocalApplicationData' | ForEach-Object {
              $root = [Environment]::GetFolderPath($_)
              if ($root) {
                Join-Path $root 'pl.nexus.aurea'
                Join-Path $root 'VELORA'
              }
            }) | Select-Object -Unique
            $installedDataBefore = @($installedProfiles | Where-Object { Test-Path -LiteralPath $_ })

            # Direct EXE launch proves isolation without launcher environment.
            $process = Start-Process -FilePath $exe -ArgumentList '--windowed' -WorkingDirectory $env:RUNNER_TEMP -PassThru
            $result.processStarted = $true
            $result.pid = $process.Id
            $deadline = (Get-Date).AddSeconds(30)
            do {
              $process.Refresh()
              $startup = Get-ChildItem -LiteralPath $dataRoot -Filter "startup-$($process.Id)-*.log" -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($startup) { $trace = Get-Content -LiteralPath $startup.FullName -Raw }
              $result.runtimeInitialized = $trace -match '(?m)^tauri-build-complete\r?$'
              $result.eventLoopStarted = $trace -match '(?m)^event-loop-started\r?$'
              $result.windowCreated = $trace -match '(?m)^window-created\r?$'
              $result.windowVisible = $trace -match '(?m)^window-visible\r?$' -and $process.MainWindowHandle -ne 0 -and $process.MainWindowTitle -eq 'VELORA (Portable Validation)'
              $result.frontendReady = $trace -match '(?m)^frontend-ready\r?$'
              if ($process.HasExited) { break }
              if ($result.windowVisible -and $result.frontendReady) {
                $result.runningAtReadiness = $true
                break
              }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)

            if (-not $process.HasExited -and $result.windowVisible) {
              $result.shutdownRequested = $process.CloseMainWindow()
              if ($result.shutdownRequested) { $null = $process.WaitForExit(20000) }
            }
            if ($process.HasExited) { $result.exitCode = $process.ExitCode }
            if ($startup) { $trace = Get-Content -LiteralPath $startup.FullName -Raw }
            $result.cleanShutdown = $result.shutdownRequested -and $process.HasExited -and
              $result.exitCode -eq 0 -and $trace -match '(?m)^exit-orderly\r?$'
            $result.portableWebViewProfile = Test-Path -LiteralPath (Join-Path $dataRoot 'EBWebView/Local State') -PathType Leaf
            $result.installedProfileCreated = @($installedProfiles | Where-Object {
              $_ -notin $installedDataBefore -and (Test-Path -LiteralPath $_)
            }).Count -gt 0
            $exactCommit = $trace -match "(?m)^process-start .* commit=$env:VELORA_SOURCE_SHA portable=true "
            $windowed = $trace -match '(?m)^mode-windowed\r?$'
            if ($result.installedProfileCreated) {
              $result.status = 'ISOLATION-BLOCKED'
            } elseif ($result.runtimeInitialized -and $result.eventLoopStarted -and $result.windowCreated -and
                $result.windowVisible -and $result.frontendReady -and $result.runningAtReadiness -and
                $result.portableWebViewProfile -and $result.cleanShutdown -and $exactCommit -and $windowed) {
              $result.status = 'PASS'
            } elseif ($result.runningAtReadiness -and -not $result.cleanShutdown) {
              $result.status = 'SHUTDOWN-BLOCKED'
            }
          } catch {
            $result.status = 'SMOKE-ERROR'
            $result.errorType = $_.Exception.GetType().Name
          } finally {
            if ($process -and -not $process.HasExited) {
              try {
                $process.Kill()
                $result.runnerTerminatedSmokeProcess = $true
              } catch {
                $result.runnerTerminationError = $_.Exception.GetType().Name
              }
            }
            $trace | Set-Content -LiteralPath $tracePath -Encoding utf8
            $result | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'smoke-result.json') -Encoding utf8
            Get-Content -LiteralPath $tracePath
            $result | ConvertTo-Json
          }

      - name: Package ZIP, SHA-256 manifest and source provenance
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'velora-portable-stage'
          $output = Join-Path $env:GITHUB_WORKSPACE 'dist/portable'
          $zipPath = Join-Path $output 'VELORA-Portable-Windows-x64.zip'
          $manifestPath = Join-Path $output 'velora-portable-manifest.json'
          $sumsPath = Join-Path $output 'SHA256SUMS.txt'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipPath -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) { throw 'Portable ZIP was not created.' }

          $arguments = @(
            'write',
            '--stage', $stage,
            '--executable', (Join-Path $stage 'nexus-aurea.exe'),
            '--package', $zipPath,
            '--manifest', $manifestPath,
            '--sums', $sumsPath,
            '--smokeFile', (Join-Path $output 'smoke-result.json'),
            '--sourceSha', $env:VELORA_SOURCE_SHA,
            '--checkoutSha', $env:VELORA_SOURCE_SHA,
            '--eventSha', $env:VELORA_EVENT_SHA,
            '--appVersion', ((Get-Content 'package.json' -Raw | ConvertFrom-Json).version),
            '--ref', $env:GITHUB_REF,
            '--event', $env:GITHUB_EVENT_NAME,
            '--runId', $env:GITHUB_RUN_ID,
            '--runAttempt', $env:GITHUB_RUN_ATTEMPT,
            '--runUrl', "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            '--workflow', $env:GITHUB_WORKFLOW,
            '--actor', $env:GITHUB_ACTOR,
            '--target', 'x86_64-pc-windows-msvc',
            '--runnerOs', $env:RUNNER_OS,
            '--dirty', 'false'
          )
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $arguments += @(
              '--prNumber', $env:VELORA_PR_NUMBER,
              '--prHeadSha', $env:VELORA_PR_HEAD_SHA,
              '--prBaseSha', $env:VELORA_PR_BASE_SHA,
              '--prHeadRef', $env:VELORA_PR_HEAD_REF,
              '--prBaseRef', $env:VELORA_PR_BASE_REF
            )
          }
          node scripts/portable-manifest.mjs @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Could not write the portable manifest.' }

          node scripts/portable-manifest.mjs verify --manifest $manifestPath --base $output --stage $stage --package $zipPath
          if ($LASTEXITCODE -ne 0) { throw 'Portable manifest verification failed.' }

          # Local SHA-256 manifest of everything shipped in dist/portable (the ZIP,
          # the portable manifest, SHA256SUMS, the smoke result): written with the
          # same tool the CI job tests, then verified against the files on disk.
          # The packaged ZIP and EXE hashes are already recorded in
          # velora-portable-manifest.json (artifacts.package / artifacts.executable);
          # this adds a plain per-file SHA-256 record for the whole output folder.
          node scripts/sha256-manifest.mjs write --root dist/portable --output dist/portable/sha256-manifest
          if ($LASTEXITCODE -ne 0) { throw 'Could not write the dist/portable SHA-256 manifest.' }
          node scripts/sha256-manifest.mjs verify --manifest dist/portable/sha256-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'The dist/portable SHA-256 manifest does not match its output files.' }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $smoke = Get-Content -LiteralPath (Join-Path $output 'smoke-result.json') -Raw | ConvertFrom-Json
          @(
            '## VELORA 3.0 first-frame recovery candidate'
            ''
            "- Source commit: $($manifest.source.sourceSha)"
            "- Event SHA: $($manifest.source.eventSha)"
            "- Run: [$($manifest.source.runId)]($($manifest.source.runUrl)) (attempt $($manifest.source.runAttempt))"
            "- ZIP SHA-256: $($manifest.artifacts.package.sha256)"
            "- EXE SHA-256: $($manifest.artifacts.executable.sha256)"
            "- Startup/shutdown smoke: $($smoke.status)"
            ''
            'No installer was run. No registry or system setting was changed. No physical hardware validation is claimed.'
            'The manifest is a hash consistency record, not a digital signature.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload portable candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: VELORA-3-First-Frame-Windows-x64-${{ env.VELORA_SOURCE_SHA }}
          path: |
            dist/portable/VELORA-Portable-Windows-x64.zip
            dist/portable/velora-portable-manifest.json
            dist/portable/SHA256SUMS.txt
            dist/portable/smoke-result.json
            dist/portable/startup-smoke.log
            dist/portable/sha256-manifest.json
            dist/portable/sha256-manifest.md
          if-no-files-found: error
          retention-days: 30

      - name: Require passing Windows startup evidence
        shell: pwsh
        run: |
          $smoke = Get-Content 'dist/portable/smoke-result.json' -Raw | ConvertFrom-Json
          if ($smoke.status -ne 'PASS') { throw "Windows startup gate failed ($($smoke.status)). See the portable artifact logs." }
