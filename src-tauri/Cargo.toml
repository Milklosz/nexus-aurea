[package]
name = "nexus-aurea"
version = "0.9.2"
description = "VELORA by Milklosh Studio — Grand Cinema entertainment launcher"
authors = ["Milklosh Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nexus_aurea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
futures-lite = "2"
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Media_Control", "Win32_Devices_Display", "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
axum = { version = "0.7", features = ["json"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
keyring = "3"
rand = "0.8"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
time = "0.3"

