[package]
name = "nexus-aurea"
version = "0.7.1"
description = "NEXUS AUREA — Grand Cinema entertainment launcher"
authors = ["NEXUS"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nexus_aurea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
futures-lite = "2"
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Media_Control", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WinRT"] }

